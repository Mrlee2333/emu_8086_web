# Auto-release: when a version bump lands on `main`, tag it (`vX.Y.Z`)
# and publish the GitHub Release with the CHANGELOG section as notes.
# The desktop workflow (`release-desktop.yml`) reacts to the tag push
# and attaches the macOS installers to the same release.
#
# Non-version pushes are a no-op (the tag already exists → skip).
# Manual escape hatch: `git tag vX.Y.Z <sha> && git push origin vX.Y.Z`.
#
# The version comes from package.json, which any PR can edit. It is therefore
# passed through `env:` and validated by a shell regex, never interpolated
# directly into a `run:` block — `${{ }}` expands before bash parses, so a
# value like `1.5.0$(id)` would otherwise execute in a job holding
# contents:write and actions:write.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  # `gh workflow run` below dispatches release-desktop.yml, which the default
  # GITHUB_TOKEN cannot do with contents:write alone (HTTP 403). Without this
  # the tag and Release are created but no installers are ever attached.
  actions: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        run: |
          set -euo pipefail
          RAW="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$RAW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::package.json version is not a safe semver: $RAW"
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags origin >/dev/null 2>&1 || true
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Build release notes from CHANGELOG
        if: steps.check.outputs.exists == 'false'
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          # Extract the `## [X.Y.Z]` section (up to the next `## ` heading).
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG section for $VERSION — falling back to generated notes."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
          FALLBACK: ${{ steps.notes.outputs.fallback }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if [ "$FALLBACK" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          fi

      # Tags pushed with GITHUB_TOKEN do not retrigger other workflows,
      # so the desktop installer build needs an explicit dispatch.
      - name: Dispatch desktop installer build
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run release-desktop.yml --ref "v$VERSION"
